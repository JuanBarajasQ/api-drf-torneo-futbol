# Blueprint de Render: crea la base Postgres y el servicio web, ambos gratis.
# En Render: New > Blueprint > elige este repo.
databases:
  - name: api-db
    plan: free
    databaseName: api
    user: api

services:
  - type: web
    name: api-drf
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python -m gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: api-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
